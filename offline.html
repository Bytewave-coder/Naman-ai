<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Naman AI - Offline</title>
  <meta name="theme-color" content="#00f3ff" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #020617;
      color: #e2e8f0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 20px;
    }
    .card {
      width: min(680px, 100%);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 24px;
      padding: 20px;
      text-align: center;
    }
    img { width: 100%; height: auto; border-radius: 16px; }
    h1 { margin-bottom: 8px; }
    p { color: #94a3b8; }
    a {
      display: inline-block;
      margin-top: 12px;
      color: #020617;
      background: linear-gradient(90deg,#22d3ee,#a855f7);
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="./assets/offline-illustration.svg" alt="Offline mode" />
    <h1>Naman AI is Offline</h1>
    <p>Your app is installed and still available. Reconnect to use live AI responses.</p>
    <a href="./index.html">Try Again</a>
  </main>
</body>
</html>
